[package]
name = "clipfyre"
version = "0.1.0"
description = "Local-first video repurposing"
authors = ["ClipFyre"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
tauri = { version = "1.5", features = ["dialog-all", "protocol-asset"] }
